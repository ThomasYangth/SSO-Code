[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sso"
version = "1.0.0"
description = "Code for 'Simple Slow Operators and Quantum Thermalization'"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "quspin>=0.3.7",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["sso*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
